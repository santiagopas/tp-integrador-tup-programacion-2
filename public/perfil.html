    <header class="site-header">
        <nav class="navbar">
            <a href="#">
                <figure class="navbar-brand">

                </li>
                <li class="nav-item">
                    <a href="./index.html" class="nav-link">Cerrar Sesión</a>
                </li>
                <li class="nav-item">
                    <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">

                    </button>
                </li>
                </li>
            </ul>
        </nav>

    <main>
        <section>

                    </div>

                        <div class="titulo">Nacimiento:</div>

                    </div>
                    <div class="atributoUsuario">
                        <div class="titulo">Edad:</div>

                    </div>
                    <div class="acciones">
                        <button class="botonMod" id="botonMod">⚙️</button>

            </div>
            </div>

            <div class="titulo"><strong>

                </strong> <button class="botonCrearPers" id="crearPersonaje"
