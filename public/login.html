<!doctype html>
<html lang="es">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Ingreso</title>
	<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png" />
	<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png" />
	<link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png" />
	<link rel="manifest" href="site.webmanifest" />
	<meta name="description"
		content="App para la Tecnicatura universitaria en programación - Asignatura: Programación 2. Crea tu propia hoja de personaje para Dungeon & Dragons y llevala a todas partes" />
	<meta name="keywords" content="Dungeon & Dragons, hoja de personaje, RPG, rol" />
	<meta name="author" content="Renzo Larena y Santiago Pasciullo" />

	<meta property="og:title" content="Hoja de personaje Dungeon & Dragon's" />
	<meta property="og:description"
		content="Crea tu propia hoja de personaje para Dungeon & Dragons y llevala a todas partes" />
	<meta http-equiv="Content-Language" content="es" />
	<link rel="icon" href="assets/img/favicon.ico" type="image/x-icon" />
	<meta property="og:image" content="https://tp-integrador-tup-programacion-2.vercel.app/assets/img/hero.png" />
	<meta property="og:url" content="https://tp-integrador-tup-programacion-2.vercel.app/" />
	<link rel="stylesheet" href="./css/pages/login.css" />
	<script type="module" src="./js/index.js" defer></script>
	<script src="./js/auth/auth.js" defer></script>
</head>

<body>
	<header class="site-header">
		<nav class="navbar">
			<a href="./index.html">
				<figure class="navbar-brand">
					<img src="./assets/icons/d20-white.svg" alt="D20" />
				</figure>
			</a>
			<button class="navbar-toggler" aria-label="Abrir menú" id="menu-toggle">
				<img src="./assets/icons/d20-white.svg" alt="Abrir menú" width="30" height="30" />
			</button>

			<ul class="navbar-nav" id="nav-menu">
				<li class="nav-item">
					<a href="./index.html" class="nav-link">Inicio</a>
				</li>
				<li class="nav-item">
					<a href="./registro.html" class="nav-link">Registrarse</a>
				</li>
				<li class="nav-item">
					<a href="./login.html" class="nav-link">Iniciar sesión</a>
				</li>
				<li class="nav-item">
					<button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">
						<img src="./assets/icons/sun.svg" alt="Cambiar tema" width="25" height="25" />
					</button>
				</li>
			</ul>
		</nav>
	</header>
	<main class="cuerpo">

		<section class="title">
			<h1>Comienza la aventura!</h1>
		</section>

		<form id="formularioIngreso">
			<div id="Ingreso">
				<div>
					<label>Ingrese su correo electrónico:</label>
					<input id="correoLogin" type="text" autocomplete="email" required />
					<label>Ingrese su contraseña:</label>
					<input id="contraLogin" type="password" autocomplete="current-password" required />
				</div>
				<div id="confirmarIngreso">
					<button id="botonIngreso" type="submit">Acceder</button>
				</div>
				<div id="errorDatosIngreso"></div>
			</div>
		</form>

		<section class="enunciados">
			<div id="texts">
				<h3>Aún no tienes cuenta? <a style="text-decoration: underline;" href="./registro.html">Registrate</a>
					gratis!</h3>
			</div>
		</section>

	</main>
	<footer class="site-footer">
		<p class="footer-text">
			© 2026 Hoja de Personaje D&D — Proyecto de Renzo Larena Spiatta y Santiago Pasciullo
		</p>
	</footer>
</body>

</html>
